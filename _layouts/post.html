---
layout: default
---

<article class="post-full">
  <h2 class="post-full-title">{{ page.title }}</h2>
  <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
    {{ page.date | date: "%B %-d, %Y" }}
  </time>
  <div class="post-body">
    {{ content }}
  </div>
</article>

<p class="back-link"><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
