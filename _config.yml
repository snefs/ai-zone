title: AI Zone
description: Thoughts about AI Development
repository: snefs/ai-zone
baseurl: "/ai-zone"
url: "https://ai-zone.dev"

theme: jekyll-theme-midnight

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

# About section shown in the left column of the home page
about: >-
  Hi, welcome to AI Zone. This is a space where I collect my thoughts on
  building software with AI agents, the changing role of developers, and the
  practical realities of shipping AI-assisted products.

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-relative-links
